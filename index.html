<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Happy Birthday AR Postcard</title>

<!--
  CSP: locks script execution to this origin plus the two pinned CDNs below
  (matched by SRI hash, so even a compromised CDN can't swap in different
  code), and allows the blob: workers MindAR's tracker spins up internally.
  'unsafe-eval' is required because A-Frame's own schema/attribute parser
  uses `new Function()` internally (core/schema.js) - not something this
  page's code does. GitHub Pages also can't set frame-ancestors/X-Frame-
  Options as real HTTP headers (static hosting, no custom headers), and
  <meta> CSP can't express frame-ancestors either, so clickjacking framing
  isn't blockable from this host - documented limitation, not an oversight.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-eval' https://aframe.io https://cdn.jsdelivr.net;
  worker-src 'self' blob:;
  child-src 'self' blob:;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  media-src 'self' blob:;
  connect-src 'self' blob:;
  base-uri 'self';
  object-src 'none';
">
<meta name="referrer" content="no-referrer">

<script src="./js/config.js"></script>

<script
  src="https://aframe.io/releases/1.5.0/aframe.min.js"
  integrity="sha384-Q1xJxUu3g9dfxTQcxLUjh6fUzeztZikm/bryr9+vQ/OT6MIrfMvjxeYlvtA/B5ES"
  crossorigin="anonymous"
></script>
<script
  src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"
  integrity="sha384-kcf/qSrCvp+E61nlypb+jERqjCMK7gpiAp/DLO+HRdq1hcccAtLHyUmK6l8bFMal"
  crossorigin="anonymous"
></script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #ar-scene, a-scene { width: 100vw; height: 100vh; }

  /* ---------- Tap-to-start overlay ---------- */
  #start-overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #2b0d0d 0%, #0a0303 100%);
    color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  #start-overlay h1 { font-size: 1.4rem; margin: 0 0 8px; }
  #start-overlay p { font-size: 0.95rem; opacity: 0.8; margin: 0 0 28px; max-width: 320px; }
  #start-btn {
    padding: 16px 36px; font-size: 1.1rem; font-weight: 600; color: #1a0000;
    background: #ff8a3d; border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 18px rgba(255, 138, 61, 0.5);
  }
  #start-btn:active { transform: scale(0.97); }
  #start-overlay.hidden { display: none; }

  /* ---------- Camera / error fallback ---------- */
  #error-overlay {
    position: fixed; inset: 0; z-index: 25;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #1a0000; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 32px; box-sizing: border-box;
  }
  #error-overlay.visible { display: flex; }
  #error-overlay h2 { font-size: 1.2rem; margin: 0 0 12px; }
  #error-overlay p { font-size: 0.9rem; opacity: 0.85; margin: 0 0 8px; max-width: 340px; line-height: 1.5; }
  #error-retry-btn {
    margin-top: 20px; padding: 14px 32px; font-size: 1rem; font-weight: 600; color: #1a0000;
    background: #ff8a3d; border: none; border-radius: 999px; cursor: pointer;
  }

  /* ---------- Tap-to-start confetti ---------- */
  #confetti-container {
    position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none;
  }
  .confetti-piece {
    position: absolute; top: -20px; width: 8px; height: 14px; opacity: 0.9;
    animation-name: confetti-fall; animation-timing-function: cubic-bezier(0.35, 0, 0.65, 1);
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall {
    to { transform: translateY(115vh) rotate(600deg); opacity: 0; }
  }
</style>
</head>
<body>

<div id="start-overlay">
  <h1>🎈 Happy Birthday!</h1>
  <p>Point your camera at the postcard and tap start to bring the picture to life.</p>
  <button id="start-btn" type="button">Tap to Start</button>
</div>


<div id="error-overlay">
  <h2 id="error-title">Camera access is needed</h2>
  <p id="error-message"></p>
  <button id="error-retry-btn" type="button">Try Again</button>
</div>

<div id="confetti-container"></div>

<a-scene
  id="ar-scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>
  <a-assets>
    <video
      id="ar-video"
      src="./video.mp4"
      preload="auto"
      loop="true"
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
    ></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false" raycaster="near: 10; far: 10000;"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
    <a-video
      id="ar-video-plane"
      src="#ar-video"
      width="1"
      height="1"
      position="0 0 0"
      rotation="0 0 0"
    ></a-video>
  </a-entity>
</a-scene>

<script src="./js/app.js"></script>

</body>
</html>
